apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: fyntrac
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      enableServiceLinks: false
      containers:
        - name: gateway
          # No local changes to fyntrac-gateway — pulled straight from GHCR (public), same
          # image docker-compose itself references.
          image: ghcr.io/19btech/fyntrac/docker/fyntrac-gateway:0.0.4-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8585
          env:
            # This image's JDK (21 GA, 21+35) does not detect the container ("container information
            # not found"): without these flags it sizes itself from the 20-CPU / 32 GB host --
            # MaxHeapSize 8.3 GB against a 1Gi memory limit (the kernel OOM-kills the pod before the
            # heap is ever collected down) and GC/JIT threads plus the virtual-thread carrier pool for
            # 20 CPUs against the CPU limit (CFS throttling). -Xmx and ActiveProcessorCount pin both
            # to this pod's limits; keep ActiveProcessorCount equal to limits.cpu.
            # UseG1GC: with one processor the JVM would otherwise fall back to the serial collector.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx512m -XX:MaxDirectMemorySize=128m -XX:ActiveProcessorCount=1 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
            - name: DATALOADER_SERVICE_URI
              value: http://dataloader:8081
            - name: REPORTING_SERVICE_URI
              value: http://reporting:8084
            - name: DSL_SERVICE_URI
              value: http://dsl:8000
            - name: INSIGHT_SERVICE_URI
              value: http://insight:4000
            - name: CORS_ALLOWED_ORIGINS
              value: "http://qa.fyntrac.com:3030,http://qa.fyntrac.com:3000,http://qa.fyntrac.com:3001"
            # EC2: must be the Elastic-IP hostname users browse to (also register
            # http://qa.fyntrac.com:8585/login/oauth2/code/zitadel as a Zitadel redirect URI).
            - name: FRONTEND_BASE_URL
              value: "http://qa.fyntrac.com:3030"
            - name: ZITADEL_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: fyntrac-secrets, key: ZITADEL_CLIENT_ID }
            - name: ZITADEL_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: fyntrac-secrets, key: ZITADEL_CLIENT_SECRET }
            - name: ZITADEL_ISSUER_URI
              valueFrom:
                secretKeyRef: { name: fyntrac-secrets, key: ZITADEL_ISSUER_URI }
            - name: ZITADEL_PROJECT_ID
              valueFrom:
                secretKeyRef: { name: fyntrac-secrets, key: ZITADEL_PROJECT_ID }
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8585
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8585
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: fyntrac
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - port: 8585
      targetPort: 8585
