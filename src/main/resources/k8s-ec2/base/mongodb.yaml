apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: fyntrac
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:8.2
          # `args`, not `command` — command would override the image's ENTRYPOINT
          # (docker-entrypoint.sh), which is what applies --bind_ip_all and runs the
          # MONGO_INITDB_ROOT_* user bootstrap. Overriding it left mongod listening
          # only on 127.0.0.1 (unreachable from other pods, though the in-container
          # readiness probe still passed) and with no root user ever created.
          args: ["--wiredTigerCacheSizeGB", "16"]
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fyntrac-secrets
                  # NOT the MONGODB_PSWD key — that's URL-encoded for connection-string use
                  # (see create-secret.sh). This env var is consumed literally by
                  # docker-entrypoint.sh, so it needs the decoded MONGODB_PSWD_RAW or mongod's
                  # actual password won't match what every client decodes from the URI.
                  key: MONGODB_PSWD_RAW
            - name: MONGO_INITDB_DATABASE
              value: master
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: mongo-init
              mountPath: /docker-entrypoint-initdb.d/mongo-init.js
              subPath: mongo-init.js
              readOnly: true
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 15
            periodSeconds: 10
            # Default timeoutSeconds (1s) is shorter than mongosh's own Node.js startup
            # time, so probes were failing even when mongod was healthy, pulling this pod
            # out of the Service's endpoints.
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "2"
              # Must stay above --wiredTigerCacheSizeGB (1.5Gi) plus mongod's own
              # connection/journal overhead, or the scheduler under-provisions this pod
              # relative to what mongod actually needs. EC2: 16 GB cache + overhead.
              memory: "20Gi"
            limits:
              # 3Gi was too tight for --wiredTigerCacheSizeGB 1.5 plus mongod's working
              # set under load and repeatedly OOM-killed the container (exit 137), even
              # though the node itself had headroom to spare.
              # 5Gi still got OOM-killed twice in one Hearst_GHK run (2026-09-20, ~2h
              # apart) once the tenant reached ~10M LTD rows: measured just before a
              # kill, tcmalloc had 3.5Gi genuinely allocated -- 1.25Gi WiredTiger cache
              # plus ~2.2Gi of per-connection/per-operation memory for ~400 open
              # connections (two dataloader pods with a 300-connection tenant pool each).
              # Host has 31Gi with ~12Gi free; 8Gi leaves the cache + connections room.
              # EC2 c5.9xlarge (72 GiB): 16 GB WiredTiger cache + ~4-8Gi connection/op memory.
              memory: "24Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongodb-data
        - name: mongo-init
          configMap:
            # Generated by k8s-ec2/overlays/ec2's configMapGenerator with disableNameSuffixHash, so
            # the name is literally "mongo-init" and this file can also be applied on its own
            # with `kubectl apply -f` (see the overlay's comment for why the hash was dropped).
            name: mongo-init
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
  namespace: fyntrac
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: fyntrac
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
