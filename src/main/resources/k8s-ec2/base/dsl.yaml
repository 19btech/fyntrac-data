apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsl
  namespace: fyntrac
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsl
  template:
    metadata:
      labels:
        app: dsl
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      enableServiceLinks: false
      containers:
        - name: dsl
          image: ghcr.io/19btech/fyntrac/docker/fyntrac-dsl:0.0.4-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            - name: DB_NAME
              value: master
            - name: MONGODB_PSWD
              valueFrom:
                secretKeyRef: { name: fyntrac-secrets, key: MONGODB_PSWD }
            - name: MONGO_URL
              value: "mongodb://root:$(MONGODB_PSWD)@mongodb:27017/master?authSource=admin"
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef: { name: fyntrac-secrets, key: GOOGLE_API_KEY }
            - name: ZITADEL_ISSUER_URI
              valueFrom:
                secretKeyRef: { name: fyntrac-secrets, key: ZITADEL_ISSUER_URI }
            - name: ZITADEL_PROJECT_ID
              valueFrom:
                secretKeyRef: { name: fyntrac-secrets, key: ZITADEL_PROJECT_ID }
            - name: DATALOADER_BASE_URI
              value: "http://gateway:8585/api/dataloader"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: dsl
  namespace: fyntrac
spec:
  type: LoadBalancer
  selector:
    app: dsl
  ports:
    - port: 8000
      targetPort: 8000
