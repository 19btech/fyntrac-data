apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsl-model
  namespace: fyntrac
spec:
  # 4 replicas — safe to scale since both of its Pulsar consumers use ConsumerType.Shared
  # (verified in app/pulsar/manager.py), not Exclusive like the bug we hit and fixed in
  # dataloader's PythonModelCompletionListener.
  # Change together with dataloader.yaml's FYNTRAC_BATCH_MAX_CONCURRENT_DISPATCH (keep it at
  # ~2x replicas): each pod works one batch at a time, so replicas beyond half that value sit
  # idle, and fewer leaves batches queueing at the broker.
  # EC2 c5.9xlarge (36 vCPU = 18 cores w/ HT): 6 x 4 = 24 vCPU. Try 7 (dispatch 14) only if
  # workers stay ~4/4 busy with batches waiting AND mongodb/dataloader are not CPU-starved.
  replicas: 6
  selector:
    matchLabels:
      app: dsl-model
  template:
    metadata:
      labels:
        app: dsl-model
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      enableServiceLinks: false
      # See dataloader.yaml: dsl-model also has Pulsar consumers that throw on startup if they
      # can't subscribe, which crashes the pod — block until Pulsar's admin API reports healthy.
      initContainers:
        - name: wait-for-pulsar
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -T 3 -O /dev/null http://pulsar:8080/admin/v2/brokers/health; do
                echo "waiting for pulsar to become healthy..."
                sleep 5
              done
              echo "pulsar is healthy"
      containers:
        - name: dsl-model
          image: ghcr.io/19btech/fyntrac/docker/fyntrac-dsl-model:0.0.4-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          env:
            - name: MONGODB_HOST
              value: mongodb
            - name: MONGODB_PORT
              value: "27017"
            - name: MONGODB_USERNAME
              value: root
            # Consumed as a discrete field (not a URI, per docker-compose's own decoded default
            # "R3s3rv#313") — needs the raw/decoded password, unlike SPRING_DATA_MONGODB_PASSWORD
            # elsewhere which gets re-parsed as part of a URI. See create-secret.sh.
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef: { name: fyntrac-secrets, key: MONGODB_PSWD_RAW }
            - name: MONGODB_AUTH_DATABASE
              value: admin
            - name: MONGODB_DEFAULT_DATABASE
              value: master
            - name: PULSAR_SERVICE_URL
              value: pulsar://pulsar:6650
            - name: MEMCACHED_HOST
              value: memcached
            - name: MEMCACHED_PORT
              value: "11211"
            - name: ZITADEL_ISSUER_URI
              valueFrom:
                secretKeyRef: { name: fyntrac-secrets, key: ZITADEL_ISSUER_URI }
            - name: ZITADEL_PROJECT_ID
              valueFrom:
                secretKeyRef: { name: fyntrac-secrets, key: ZITADEL_PROJECT_ID }
            - name: CORS_ALLOWED_ORIGINS
              value: "http://qa.fyntrac.com:3030"
            - name: LOG_LEVEL
              value: INFO
            # Size of the per-batch ProcessPoolExecutor. Unset, the app falls back to
            # os.cpu_count(), which inside a cgroup still reports every HOST core (20 here) — so
            # each pod ran a 20-process pool against a 1-core quota and spent ~80% of scheduler
            # periods throttled (cpu.stat measured over a full Hearst_GHK run). Keep this equal
            # to the CPU limit below: more workers than quota just adds contention and memory.
            - name: MAX_PROCESS_WORKERS
              value: "4"
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              # = limits.cpu on EC2 so the scheduler reserves real cores for every worker pod.
              cpu: "4"
              memory: "1Gi"
            limits:
              # Model execution is CPU-bound and is the run's dominant wall-clock cost; paired
              # with MAX_PROCESS_WORKERS above. At 3 cores with all 4 pods busy the workers were
              # each pegged at ~100% and the pods throttled 12-14% of periods. 4 replicas x 4 =
              # 16 of the node's 20 cores; mongodb and the JVMs together use ~2-3.
              cpu: "4"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: dsl-model
  namespace: fyntrac
spec:
  type: LoadBalancer
  selector:
    app: dsl-model
  ports:
    - port: 8090
      targetPort: 8090
