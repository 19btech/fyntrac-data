name: Run Functional Tests

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
    inputs:
      test_case:
        description: "Test case to run"
        required: true
        default: "ALL"
        type: choice
        options:
          - ALL
          - Hearst
          - IFRS9_Stage3
          - IFRS9_Stage3_DSL
          - TestAsset
          - TestEvent
          - TestGFO
          - TestGL
          - TestGL2
          - TestIFRS9
          - TestRevenue
          - TestRevenue_DSL
          - TestSBO
          - TestSBO_DSL
          - TestSBO_Replay_M1
          - TestSBO_Replay_M1_DSL
          - TestSBO_Replay_M2
          - TestSBO_Replay_M2_DSL
          - TestSBO_Replay_Monthly
          - TestSBO_Replay_Monthly_RC

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Run remote tests via SSH
        id: ssh_run
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 30m         # Timeout in 30 minutes
          envs: TEST_CASE
          script: |
            cd ~/Workspace/fyntrac-data
            chmod +x run_tests.sh run_dsl_tests.sh run_single_test.sh
            if [ "$TEST_CASE" = "ALL" ]; then
              ./run_tests.sh
              ./run_dsl_tests.sh
            else
              ./run_single_test.sh "$TEST_CASE"
            fi
        env:
          TEST_CASE: ${{ inputs.test_case }}

      - name: Check test results and fail if any test failed
        if: ${{ always() }}
        run: |
          echo "========== Full test output =========="
          echo "${{ steps.ssh_run.outputs.stdout }}"

          echo
          echo "========== Test Summary Section =========="
          echo "${{ steps.ssh_run.outputs.stdout }}" | sed -n '/^=\{15,\} TEST SUMMARY =\{15,\}$/,/^=\{15,\}$/p' || echo "Summary section not found"

          # Fail if any test failed
          if echo "${{ steps.ssh_run.outputs.stdout }}" | grep -qP '\tFAILED\b'; then
            echo "❌ One or more tests failed."
            exit 1
          else
            echo "✅ All tests passed."
          fi
