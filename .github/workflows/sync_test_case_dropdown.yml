name: Sync Test Case Dropdown

on:
  push:
    branches: [main]
    paths:
      - "src/test/resources/TestDriver/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Regenerate test case dropdown options
        run: python3 .github/scripts/sync_test_case_dropdown.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- .github/workflows/run_remote_tests.yml; then
            echo "Dropdown already up to date; nothing to commit."
          else
            git add .github/workflows/run_remote_tests.yml
            git commit -m "Sync test case dropdown with TestDriver folders"
            git push
          fi
